name: Deobfuscate Py-Fuscate

on:
  workflow_dispatch:
    inputs:
      filename:
        description: 'Nama file Python yang di-obfuscate'
        required: true
        default: 'iyan-en.py'
      output_filename:
        description: 'Nama file output hasil deobfuscate'
        required: true
        default: 'output.txt'

jobs:
  deobfuscate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: List files (debug)
        run: ls -la

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Create deobfuscator script
        run: |
          cat > deobfuscate.py << 'EOF'
          import base64
          import marshal
          import re
          import dis
          import zlib
          import gzip
          import lzma
          import bz2
          import types
          import sys
          import traceback

          def recursive_disassemble(code_obj):
              instructions = list(dis.get_instructions(code_obj))
              all_instructions = instructions.copy()
              for instr in instructions:
                  if instr.opname == "LOAD_CONST" and isinstance(instr.argval, types.CodeType):
                      nested_instructions = recursive_disassemble(instr.argval)
                      all_instructions.extend(nested_instructions)
              return all_instructions

          def convert_to_bytecode(disassembled):
              for instr in disassembled:
                  print(f"{instr.offset} {instr.opname} {instr.arg} ({instr.argrepr})")

          def zlib_loop(disassembled):
              while True:
                  for instr in disassembled:
                      if instr.opname == 'LOAD_CONST' and isinstance(instr.argval, bytes):
                          try:
                              decompressed = zlib.decompress(instr.argval)
                              unmarshalled = marshal.loads(decompressed)
                              disassembled = recursive_disassemble(unmarshalled)
                              break
                          except Exception as e:
                              continue
                  else:
                      break
              return disassembled

          def lzma_loop(disassembled):
              while True:
                  for instr in disassembled:
                      if instr.opname == 'LOAD_CONST' and isinstance(instr.argval, bytes):
                          try:
                              decompressed = lzma.decompress(instr.argval)
                              unmarshalled = marshal.loads(decompressed)
                              disassembled = recursive_disassemble(unmarshalled)
                              break
                          except Exception as e:
                              continue
                  else:
                      break
              return disassembled

          def base64_loop(disassembled):
              while True:
                  for instr in disassembled:
                      if instr.opname == 'LOAD_CONST' and isinstance(instr.argval, bytes):
                          try:
                              decoded = base64.b64decode(instr.argval)
                              unmarshalled = marshal.loads(decoded)
                              disassembled = recursive_disassemble(unmarshalled)
                              break
                          except Exception as e:
                              continue
                  else:
                      break
              return disassembled

          def bz2_loop(disassembled):
              while True:
                  for instr in disassembled:
                      if instr.opname == 'LOAD_CONST' and isinstance(instr.argval, bytes):
                          try:
                              decompressed = bz2.decompress(instr.argval)
                              unmarshalled = marshal.loads(decompressed)
                              disassembled = recursive_disassemble(unmarshalled)
                              break
                          except Exception as e:
                              continue
                  else:
                      break
              return disassembled

          def gzip_loop(disassembled):
              while True:
                  for instr in disassembled:
                      if instr.opname == 'LOAD_CONST' and isinstance(instr.argval, bytes):
                          try:
                              decompressed = gzip.decompress(instr.argval)
                              unmarshalled = marshal.loads(decompressed)
                              disassembled = recursive_disassemble(unmarshalled)
                              break
                          except Exception as e:
                              continue
                  else:
                      break
              return disassembled

          def get_second_method(disassembled):
              i = len(disassembled)
              for instr in range(i):
                  if disassembled[instr].argval == 'loads':
                      j = instr
                      break
              second_method = disassembled[j+2].argval
              return second_method

          def stage1(obfuscated):
              disassembled = None

              # base64
              match = re.search(r'binascii.a2b_base64\(b\'(.*?)\'\)', obfuscated)
              if match:
                  print("[+] Found base64")
                  encoded = match.group(1)
                  encoded = encoded.encode('utf-8')
                  encoded = base64.b64decode(encoded)
                  unmarshalled = marshal.loads(encoded)
                  disassembled = recursive_disassemble(unmarshalled)

              # lzma
              if not disassembled:
                  match = re.search(r'lzma.decompress\(b\'(.*?)\'\)', obfuscated, re.DOTALL)
                  if match:
                      print("[+] Found lzma")
                      match = match.group(1)
                      exec_globals = {}
                      exec(f"match = b'{match}'", exec_globals)
                      decompressed = lzma.decompress(exec_globals['match'])
                      unmarshalled = marshal.loads(decompressed)
                      disassembled = recursive_disassemble(unmarshalled)

              # bz2
              if not disassembled:
                  match = re.search(r'bz2.decompress\(b\'(.*?)\'\)', obfuscated, re.DOTALL)
                  if match:
                      print("[+] Found bz2")
                      match = match.group(1)
                      exec_globals = {}
                      exec(f"match = b'{match}'", exec_globals)
                      decompressed = bz2.decompress(exec_globals['match'])
                      unmarshalled = marshal.loads(decompressed)
                      disassembled = recursive_disassemble(unmarshalled)

              # gzip
              if not disassembled:
                  match = re.search(r'gzip.decompress\(b\'(.*?)\'\)', obfuscated, re.DOTALL)
                  if match:
                      print("[+] Found gzip")
                      match = match.group(1)
                      exec_globals = {}
                      exec(f"match = b'{match}'", exec_globals)
                      decompressed = gzip.decompress(exec_globals['match'])
                      unmarshalled = marshal.loads(decompressed)
                      disassembled = recursive_disassemble(unmarshalled)

              # zlib
              if not disassembled:
                  match = re.search(r'zlib.decompress\(b\'(.*?)\'\)', obfuscated, re.DOTALL)
                  if match:
                      print("[+] Found zlib")
                      match = match.group(1)
                      exec_globals = {}
                      exec(f"match = b'{match}'", exec_globals)
                      decompressed = zlib.decompress(exec_globals['match'])
                      unmarshalled = marshal.loads(decompressed)
                      disassembled = recursive_disassemble(unmarshalled)

              if not disassembled:
                  # Try to extract raw bytes from file (maybe already binary)
                  print("[-] No compression found. Trying to read as marshal directly.")
                  try:
                      unmarshalled = marshal.loads(obfuscated.encode('latin1'))
                      disassembled = recursive_disassemble(unmarshalled)
                  except:
                      pass

              if not disassembled:
                  print("[-] Failed to extract any code. Check if file is valid.")
                  sys.exit(1)

              while True:
                  try:
                      second_method = get_second_method(disassembled)
                  except:
                      break
                  if 'zlib' in second_method:
                      disassembled = zlib_loop(disassembled)
                  elif 'lzma' in second_method:
                      disassembled = lzma_loop(disassembled)
                  elif 'binascii' in second_method:
                      disassembled = base64_loop(disassembled)
                  elif 'bz2' in second_method:
                      disassembled = bz2_loop(disassembled)
                  elif 'gzip' in second_method:
                      disassembled = gzip_loop(disassembled)
                  else:
                      break
              convert_to_bytecode(disassembled)

          if __name__ == "__main__":
              if len(sys.argv) < 2:
                  print("Usage: python deobfuscate.py <input_file>")
                  sys.exit(1)

              try:
                  with open(sys.argv[1], 'r', encoding='utf-8', errors='ignore') as f:
                      obfuscated = f.read()
                  stage1(obfuscated)
              except Exception as e:
                  print(f"Error: {e}")
                  traceback.print_exc()
                  sys.exit(1)
          EOF

      - name: Check if input file exists
        run: |
          if [ ! -f "${{ github.event.inputs.filename }}" ]; then
            echo "❌ File ${{ github.event.inputs.filename }} not found!"
            echo "📁 Available files:"
            ls -la
            exit 1
          fi

      - name: Run deobfuscator with debug
        run: |
          python -u deobfuscate.py "${{ github.event.inputs.filename }}" 2>&1 | tee "${{ github.event.inputs.output_filename }}"

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: deobfuscated-result
          path: ${{ github.event.inputs.output_filename }}
