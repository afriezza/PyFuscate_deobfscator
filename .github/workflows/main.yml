name: Deobfuscate Py-Fuscate

on:
  workflow_dispatch:

jobs:
  deobfuscate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Clone deobfuscator
        run: git clone https://github.com/d33znu75/PyFuscate_deobfscator.git
      - name: Install dependencies
        run: pip install uncompyle6
      - name: Deobfuscate
        run: python PyFuscate_deobfscator/deobfuscate.py iyan-en.py > source.py
      - uses: actions/upload-artifact@v4
        with:
          name: deobfuscated-source
          path: source.py
